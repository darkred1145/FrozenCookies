name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Upstream repo (owner/name)"
        required: false
        default: "erbkaiser/FrozenCookies"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        id: merge
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'erbkaiser/FrozenCookies' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main main; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B sync/upstream
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --force origin sync/upstream
          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        if: steps.merge.outputs.status == 'merged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${{ github.repository }}" -F allow_auto_merge=true >/dev/null 2>&1 \
            || echo "could not enable auto-merge via API"
          if ! gh pr list --head sync/upstream --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head sync/upstream \
              --title "Sync upstream" \
              --body "Automated merge of upstream/main (erbkaiser/FrozenCookies) into this fork." >/dev/null
          fi
          pr=$(gh pr list --head sync/upstream --state open --json number --jq '.[0].number')
          if gh pr merge "$pr" --auto --merge 2>/dev/null; then
            echo "auto-merge queued for PR #$pr"
          elif gh pr merge "$pr" --merge 2>/dev/null; then
            echo "merged PR #$pr directly"
          else
            echo "could not merge PR #$pr; left open for manual merge"
          fi

      - name: Report conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "Upstream sync conflict" \
            --body "Merging upstream/main into this fork conflicted. Resolve in the GitHub UI: https://github.com/${{ github.repository }}/compare/main...erbkaiser:main" >/dev/null
